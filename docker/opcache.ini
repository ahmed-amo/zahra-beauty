; Caches compiled PHP bytecode in RAM. Kept small: this is billed 24/7.
; 16M + 2M interned strings is enough for this storefront.

opcache.enable=1
opcache.memory_consumption=16
opcache.interned_strings_buffer=2
opcache.max_accelerated_files=6000
opcache.revalidate_freq=0
opcache.validate_timestamps=0
opcache.save_comments=0
opcache.fast_shutdown=1
opcache.jit=0
opcache.jit_buffer_size=0
