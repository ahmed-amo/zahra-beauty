; Prevent Railway from confusing PHP-FPM's TCP port with the public HTTP port.
; Nginx proxies to this socket; only nginx should listen on $PORT.
;
; RAM-tuned for Railway Hobby / low traffic:
; - ondemand = workers spawn only when requests arrive, then exit
; - low max_children so a spike cannot hold ~1GB of PHP workers

[www]
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

user = www-data
group = www-data

pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 3s
pm.max_requests = 50

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
php_admin_value[memory_limit] = 128M
