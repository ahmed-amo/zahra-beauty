worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    client_max_body_size 80m;

    # Railway terminates TLS; honour the forwarded scheme for PHP/Laravel.
    map $http_x_forwarded_proto $fastcgi_https {
        default off;
        https on;
    }

    server {
        # Replaced at container start with Railway $PORT (fallback 8080).
        listen __PORT__;
        server_name _;
        root /var/www/html/public;
        index index.php;

        location /build {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|woff2)$ {
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        location /catpics {
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # Uploaded media via storage:link — missing files must 404, not fall
        # through to Laravel HTML (which browsers show as a broken image).
        location /storage {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param HTTPS $fastcgi_https;
            fastcgi_read_timeout 180;
            fastcgi_buffers 8 16k;
            fastcgi_buffer_size 16k;
            fastcgi_busy_buffers_size 32k;
        }

        location ~ /\. {
            deny all;
        }
    }
}
